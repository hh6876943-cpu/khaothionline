<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Edu - Nền tảng Khảo thí & Ôn luyện Thông minh</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col antialiased">

    <header class="bg-gray-800/90 backdrop-blur border-b border-gray-700 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('dashboard')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-300">Zenith Edu</h1>
                    <p class="text-xs text-gray-400">Khảo thí & Ôn luyện Thông minh</p>
                </div>
            </div>

            <nav class="hidden md:flex items-center space-x-2">
                <button onclick="switchView('dashboard')" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-700/60 transition flex items-center gap-2">
                    <i class="fa-solid fa-house text-brand-500"></i> Trang chủ
                </button>
                <button onclick="switchView('examArena')" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-700/60 transition flex items-center gap-2">
                    <i class="fa-solid fa-file-pen text-emerald-400"></i> Phòng Thi
                </button>
                <button onclick="switchView('theoryArena')" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-700/60 transition flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-amber-400"></i> Đấu trường Lý thuyết
                </button>
                <button onclick="switchView('historyView')" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-700/60 transition flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-purple-400"></i> Lịch sử bài làm
                </button>
            </nav>

            <div class="flex items-center gap-3">
                <button id="adminToggleBtn" onclick="toggleAdminPanel()" class="bg-gray-700 hover:bg-gray-600 px-3.5 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 border border-gray-600">
                    <i class="fa-solid fa-user-gear text-amber-400"></i> <span id="adminBtnText">Chế độ Admin</span>
                </button>
            </div>
        </div>
    </header>

    <main id="mainContainer" class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        </main>

    <footer class="bg-gray-800 border-t border-gray-700 py-4 mt-auto text-center text-xs text-gray-400">
        <p>© 2026 Zenith Edu System - Nền tảng học tập & Khảo thí hiện đại.</p>
    </footer>

    <div id="examRoomModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-5 border-b border-gray-700 flex justify-between items-center bg-gray-800/80 sticky top-0 z-10">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-folder-plus text-brand-500"></i> <span id="modalExamTitle">Tạo Phòng Thi Mới</span>
                </h3>
                <button onclick="closeExamRoomModal()" class="text-gray-400 hover:text-white text-xl p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="examRoomForm" onsubmit="saveExamRoomData(event)" class="p-6 space-y-6 flex-1 overflow-y-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Tên bài thi / Phòng thi *</label>
                        <input type="text" id="erTitle" required placeholder="VD: Đề thi thử THPT Quốc Gia Môn Toán #1" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Môn học *</label>
                        <input type="text" id="erSubject" required placeholder="VD: Toán học, Vật Lý, Hóa học..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Thời gian làm bài (Phút) *</label>
                        <input type="number" id="erDuration" min="1" value="45" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                </div>

                <div class="bg-gray-900/80 p-4 rounded-xl border border-gray-700">
                    <label class="block text-sm font-bold text-brand-400 mb-3">Hình thức & Hình thức soạn đề:</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <label class="flex items-center gap-3 p-3 rounded-lg border border-gray-700 bg-gray-800/50 cursor-pointer hover:border-brand-500 transition">
                            <input type="radio" name="erType" value="pdf" checked onchange="toggleExamCreationType()" class="text-brand-600 focus:ring-brand-500">
                            <div>
                                <p class="text-sm font-semibold text-gray-200">Dạng 1: File PDF / Link Drive</p>
                                <p class="text-xs text-gray-400">Hiển thị file PDF 1 bên + Phiếu tô đáp án 1 bên</p>
                            </div>
                        </label>
                        <label class="flex items-center gap-3 p-3 rounded-lg border border-gray-700 bg-gray-800/50 cursor-pointer hover:border-brand-500 transition">
                            <input type="radio" name="erType" value="interactive" onchange="toggleExamCreationType()" class="text-brand-600 focus:ring-brand-500">
                            <div>
                                <p class="text-sm font-semibold text-gray-200">Dạng 2: Soạn câu hỏi trực tiếp</p>
                                <p class="text-xs text-gray-400">Gõ câu hỏi, đáp án, LaTeX, ảnh/video & lời giải chi tiết</p>
                            </div>
                        </label>
                    </div>
                </div>

                <div id="pdfTypeSection" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Link File PDF (Google Drive Embed / Online PDF)</label>
                        <input type="url" id="erPdfLink" placeholder="https://drive.google.com/file/d/.../preview" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Số lượng câu hỏi</label>
                        <input type="number" id="erQCount" min="1" max="100" value="20" onchange="generatePdfAnswerKeyInputs()" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-2">Bảng đáp án đúng (A, B, C, D)</label>
                        <div id="pdfAnswerKeyContainer" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-10 gap-2 max-h-48 overflow-y-auto p-2 bg-gray-900 rounded-lg border border-gray-700">
                            </div>
                    </div>
                </div>

                <div id="interactiveTypeSection" class="hidden space-y-4">
                    <div class="flex justify-between items-center bg-gray-900 p-3 rounded-lg border border-gray-700">
                        <span class="text-sm font-medium text-gray-300">Danh sách câu hỏi soạn sẵn</span>
                        <button type="button" onclick="addNewQuestionBuilderItem()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1 transition">
                            <i class="fa-solid fa-plus"></i> Thêm câu hỏi
                        </button>
                    </div>

                    <div id="interactiveQuestionsContainer" class="space-y-6">
                        </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-gray-700">
                    <button type="button" onclick="closeExamRoomModal()" class="px-4 py-2 rounded-lg text-sm bg-gray-700 hover:bg-gray-600 text-gray-300">Hủy</button>
                    <button type="submit" class="px-5 py-2 rounded-lg text-sm bg-brand-600 hover:bg-brand-500 text-white font-semibold flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Lưu Phòng Thi
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- DATA STATE & INITIALIZATION ---
        const firebaseConfig = {
            databaseURL: "https://khoa-hoc-online-f936d-default-rtdb.firebaseio.com"
        };

        let db = null;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.database();
        } catch (e) {
            console.warn("Firebase Init fallback:", e);
        }

        let isAdmin = false;
        let currentView = 'dashboard';
        let examRoomsList = [];
        let theoryRoomsList = [];
        let submissionsList = [];

        // Sample Data Initialization
        const sampleExamRooms = [
            {
                id: 'exam_demo_1',
                title: 'Đề Thi Thử Toán Học THPT Quốc Gia - Đề số 01',
                subject: 'Toán Học',
                duration: 45,
                type: 'interactive',
                questions: [
                    {
                        id: 1,
                        content: 'Cho hàm số $y = f(x)$ có bảng biến thiên như hình bên. Khẳng định nào sau đây đúng?<br><div class="my-2"><img src="https://via.placeholder.com/400x150/1e293b/38bdf8?text=Do+thi+ham+so+f(x)" class="rounded border border-gray-700 max-w-full"></div> Cho phương trình $f(x) = 2$.',
                        options: {
                            A: 'Hàm số đồng biến trên $(-\\infty; 1)$',
                            B: 'Hàm số đạt cực đại tại $x = 2$',
                            C: 'Giá trị nhỏ nhất của hàm số bằng $-3$',
                            D: 'Phương trình có 3 nghiệm thực phân biệt'
                        },
                        correct: 'D',
                        explanation: 'Dựa vào bảng biến thiên / đồ thị, đường thẳng $y = 2$ cắt đồ thị hàm số $y = f(x)$ tại 3 điểm phân biệt. Do đó phương trình $f(x) = 2$ có 3 nghiệm thực phân biệt.'
                    },
                    {
                        id: 2,
                        content: 'Tích phân $\\int_{0}^{1} e^{2x} dx$ bằng bao nhiêu?',
                        options: {
                            A: '$\\frac{e^2 - 1}{2}$',
                            B: '$e^2 - 1$',
                            C: '$\\frac{e^2 + 1}{2}$',
                            D: '$2(e^2 - 1)$'
                        },
                        correct: 'A',
                        explanation: 'Ta có: $\\int_{0}^{1} e^{2x} dx = \\left. \\frac{1}{2} e^{2x} \\right|_{0}^{1} = \\frac{1}{2}(e^2 - e^0) = \\frac{e^2 - 1}{2}$.'
                    }
                ]
            },
            {
                id: 'exam_demo_2',
                title: 'Kiểm tra Ôn tập Vật Lý 12 - Trắc nghiệm PDF',
                subject: 'Vật Lý',
                duration: 30,
                type: 'pdf',
                link: 'https://drive.google.com/file/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs/preview',
                qCount: 5,
                answerKeys: { 1: 'A', 2: 'B', 3: 'C', 4: 'D', 5: 'A' }
            }
        ];

        // --- CORE FUNCTIONS ON LOAD ---
        window.addEventListener('DOMContentLoaded', () => {
            loadLocalData();
            switchView('dashboard');
        });

        function loadLocalData() {
            const savedRooms = localStorage.getItem('zenith_exam_rooms');
            if (savedRooms) {
                examRoomsList = JSON.parse(savedRooms);
            } else {
                examRoomsList = sampleExamRooms;
                saveDataToStorage();
            }

            const savedSubmissions = localStorage.getItem('zenith_submissions');
            if (savedSubmissions) {
                submissionsList = JSON.parse(savedSubmissions);
            }

            // Sync with Firebase if available
            if (db) {
                db.ref('exam_rooms').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        examRoomsList = Object.values(data);
                        if (currentView === 'dashboard' || currentView === 'examArena') renderCurrentView();
                    }
                });
            }
        }

        function saveDataToStorage() {
            localStorage.setItem('zenith_exam_rooms', JSON.stringify(examRoomsList));
            localStorage.setItem('zenith_submissions', JSON.stringify(submissionsList));
            if (db) {
                db.ref('exam_rooms').set(examRoomsList);
            }
        }

        function triggerMathJax() {
            setTimeout(() => {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise().catch(err => console.log('MathJax Error:', err));
                }
            }, 50);
        }

        function toggleAdminPanel() {
            isAdmin = !isAdmin;
            const btnText = document.getElementById('adminBtnText');
            const adminBtn = document.getElementById('adminToggleBtn');
            if (isAdmin) {
                btnText.innerText = "Admin: BẬT";
                adminBtn.classList.replace('bg-gray-700', 'bg-amber-600');
                adminBtn.classList.replace('hover:bg-gray-600', 'hover:bg-amber-500');
            } else {
                btnText.innerText = "Chế độ Admin";
                adminBtn.classList.replace('bg-amber-600', 'bg-gray-700');
                adminBtn.classList.replace('hover:bg-amber-500', 'hover:bg-gray-600');
            }
            renderCurrentView();
        }

        // --- NAVIGATION & ROUTING ---
        function switchView(viewName, param = null) {
            currentView = viewName;
            const container = document.getElementById('mainContainer');
            container.innerHTML = '';

            if (viewName === 'dashboard') {
                renderDashboard(container);
            } else if (viewName === 'examArena') {
                renderExamArena(container);
            } else if (viewName === 'theoryArena') {
                renderTheoryArena(container);
            } else if (viewName === 'takeExam') {
                renderTakeExamView(container, param);
            } else if (viewName === 'reviewSubmission') {
                renderReviewSubmissionView(container, param);
            } else if (viewName === 'historyView') {
                renderHistoryView(container);
            }
            
            triggerMathJax();
        }

        function renderCurrentView() {
            switchView(currentView);
        }

        // --- VIEW 1: DASHBOARD ---
        function renderDashboard(container) {
            container.innerHTML = `
                <div class="space-y-8">
                    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-brand-900 via-indigo-900 to-purple-900 p-8 md:p-12 border border-brand-500/30 shadow-2xl">
                        <div class="relative z-10 max-w-2xl space-y-4">
                            <span class="inline-block px-3 py-1 bg-brand-500/20 text-brand-300 rounded-full text-xs font-semibold tracking-wide border border-brand-500/30">
                                🚀 Nền tảng Ôn Thi Công Nghệ Cao 2026
                            </span>
                            <h2 class="text-3xl md:text-5xl font-extrabold text-white leading-tight">
                                Bứt Phá Điểm Số Với Hệ Thống Thi Thông Minh
                            </h2>
                            <p class="text-gray-300 text-sm md:text-base">
                                Hỗ trợ gõ đề LaTeX, MathType, chèn ảnh, video, âm thanh cùng hệ thống chấm điểm và lời giải chi tiết tức thì.
                            </p>
                            <div class="flex flex-wrap gap-4 pt-2">
                                <button onclick="switchView('examArena')" class="bg-brand-600 hover:bg-brand-500 text-white font-semibold px-6 py-3 rounded-xl shadow-lg transition flex items-center gap-2">
                                    <i class="fa-solid fa-pen-to-square"></i> Vào Phòng Thi Ngay
                                </button>
                                ${isAdmin ? `
                                <button onclick="openExamRoomModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-5 py-3 rounded-xl shadow-lg transition flex items-center gap-2">
                                    <i class="fa-solid fa-plus-circle"></i> Soạn Đề Mới
                                </button>` : ''}
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-fire text-amber-500"></i> Phòng Thi Nổi Bật
                            </h3>
                            <button onclick="switchView('examArena')" class="text-brand-400 hover:text-brand-300 text-sm font-medium">Xem tất cả <i class="fa-solid fa-arrow-right"></i></button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${examRoomsList.map(room => renderExamCardHtml(room)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderExamCardHtml(room) {
            const isInteractive = room.type === 'interactive';
            const qCount = isInteractive ? (room.questions ? room.questions.length : 0) : (room.qCount || 0);

            return `
                <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5 hover:border-brand-500/50 transition flex flex-col justify-between shadow-lg group">
                    <div class="space-y-3">
                        <div class="flex justify-between items-start gap-2">
                            <span class="px-2.5 py-1 bg-brand-500/10 text-brand-400 border border-brand-500/20 text-xs font-semibold rounded-lg">
                                ${room.subject || 'Tổng hợp'}
                            </span>
                            <span class="px-2 py-0.5 ${isInteractive ? 'bg-purple-500/10 text-purple-400 border-purple-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20'} border text-[11px] font-medium rounded">
                                ${isInteractive ? '✍️ Đề Soạn Tương Tác' : '📄 Đề PDF / Drive'}
                            </span>
                        </div>
                        <h4 class="font-bold text-gray-100 group-hover:text-brand-400 transition text-base line-clamp-2">
                            ${room.title}
                        </h4>
                        <div class="flex items-center gap-4 text-xs text-gray-400">
                            <span><i class="fa-regular fa-clock text-brand-400"></i> ${room.duration} phút</span>
                            <span><i class="fa-solid fa-list-check text-emerald-400"></i> ${qCount} câu hỏi</span>
                        </div>
                    </div>

                    <div class="pt-5 mt-4 border-t border-gray-700/60 flex items-center justify-between">
                        ${isAdmin ? `
                        <button onclick="deleteExamRoom('${room.id}')" class="text-red-400 hover:text-red-300 text-xs px-2 py-1 rounded border border-red-500/20 hover:bg-red-500/10 transition">
                            <i class="fa-solid fa-trash"></i> Xóa
                        </button>` : '<div></div>'}
                        <button onclick="switchView('takeExam', '${room.id}')" class="bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition flex items-center gap-1.5">
                            Bắt đầu làm bài <i class="fa-solid fa-chevron-right text-[10px]"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // --- VIEW 2: EXAM ARENA LIST ---
        function renderExamArena(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gray-800 p-6 rounded-2xl border border-gray-700">
                        <div>
                            <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-file-pen text-emerald-400"></i> Thư Viện Phòng Thi
                            </h2>
                            <p class="text-sm text-gray-400">Chọn bài kiểm tra để bắt đầu ôn tập & thử sức ngay</p>
                        </div>
                        ${isAdmin ? `
                        <button onclick="openExamRoomModal()" class="bg-brand-600 hover:bg-brand-500 text-white font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-2 text-sm shadow-md">
                            <i class="fa-solid fa-plus"></i> Tạo Đề Thi Mới
                        </button>` : ''}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${examRoomsList.length ? examRoomsList.map(room => renderExamCardHtml(room)).join('') : `
                            <div class="col-span-full py-12 text-center text-gray-400 bg-gray-800/50 rounded-2xl border border-gray-700">
                                <i class="fa-solid fa-folder-open text-4xl mb-3 text-gray-600"></i>
                                <p>Chưa có đề thi nào trong hệ thống.</p>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        // --- VIEW 3: THEORY ARENA PLACEHOLDER ---
        function renderTheoryArena(container) {
            container.innerHTML = `
                <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 text-center space-y-4">
                    <div class="w-16 h-16 bg-amber-500/10 text-amber-400 rounded-2xl mx-auto flex items-center justify-center text-3xl border border-amber-500/20">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-white">Đấu Trường Lý Thuyết</h2>
                    <p class="text-gray-400 max-w-md mx-auto text-sm">Chế độ luyện tập phản xạ lý thuyết tốc độ cao giúp ghi nhớ kiến thức cốt lõi chuẩn xác.</p>
                </div>
            `;
        }

        // --- VIEW 4: STUDENT TAKING EXAM SCREEN ---
        let currentTakingExam = null;
        let examTimerInterval = null;
        let studentAnswers = {};

        function renderTakeExamView(container, roomId) {

                alert("Không tìm thấy bài thi này!");
                switchView('examArena');
                return;
            }

            currentTakingExam = room;
            studentAnswers = {};

            const isInteractive = room.type === 'interactive';
            const questions = isInteractive ? (room.questions || []) : [];
            const qCount = isInteractive ? questions.length : (room.qCount || 0);

            let timeLeftSeconds = room.duration * 60;

            container.innerHTML = `
                <div class="space-y-6">

                            <span class="text-xs text-brand-400 font-semibold uppercase tracking-wider">${room.subject}</span>

                        </div>
                        <div class="flex items-center gap-6">
                            <div class="bg-gray-900 px-4 py-2 rounded-xl border border-gray-700 flex items-center gap-2">
                                <i class="fa-solid fa-clock text-amber-400 animate-pulse"></i>
                                <span id="timerDisplay" class="font-mono text-xl font-bold text-amber-300">--:--</span>
                            </div>
                            <button onclick="submitExam()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2">

                    </div>

                    ${isInteractive ? `
                        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                            <div class="lg:col-span-3 space-y-6">
                                ${questions.map((q, idx) => `
                                    <div id="q_card_${idx + 1}" class="bg-gray-800 border border-gray-700 rounded-2xl p-6 space-y-4 shadow-lg">
                                        <div class="flex justify-between items-start border-b border-gray-700/60 pb-3">
                                            <span class="font-bold text-brand-400 text-base">Câu ${idx + 1}:</span>
                                        </div>
                                        
                                        <div class="text-gray-100 text-base leading-relaxed overflow-x-auto">
                                            ${q.content}
                                        </div>

                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
                                            ${['A', 'B', 'C', 'D'].map(opt => `
                                                <label onclick="selectStudentAnswer(${idx + 1}, '${opt}')" id="opt_btn_${idx + 1}_${opt}" class="flex items-start gap-3 p-3.5 rounded-xl border border-gray-700 bg-gray-900/60 cursor-pointer hover:border-brand-500 hover:bg-gray-900 transition">
                                                    <input type="radio" name="q_${idx + 1}" value="${opt}" class="mt-1 text-brand-600 focus:ring-brand-500">
                                                    <div class="text-sm">
                                                        <span class="font-bold text-brand-400">${opt}.</span> 
                                                        <span class="text-gray-200">${q.options ? (q.options[opt] || '') : ''}</span>
                                                    </div>
                                                </label>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="space-y-4">
                                <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5 sticky top-36 shadow-lg">
                                    <h4 class="font-bold text-gray-200 text-sm mb-3 flex items-center gap-2">
                                        <i class="fa-solid fa-border-all text-brand-400"></i> Danh sách câu hỏi
                                    </h4>
                                    <div class="grid grid-cols-5 gap-2 max-h-80 overflow-y-auto pr-1">
                                        ${questions.map((_, idx) => `
                                            <button id="nav_btn_${idx + 1}" onclick="scrollToQuestion(${idx + 1})" class="w-full aspect-square rounded-lg border border-gray-700 bg-gray-900 text-xs font-semibold text-gray-400 hover:border-brand-500 transition flex items-center justify-center">
                                                ${idx + 1}
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div class="lg:col-span-2 bg-gray-800 rounded-2xl border border-gray-700 overflow-hidden shadow-lg h-[75vh]">
                                <iframe src="${room.link || ''}" class="w-full h-full border-0"></iframe>
                            </div>

                            <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5 h-[75vh] flex flex-col shadow-lg">
                                <h4 class="font-bold text-gray-200 text-sm mb-3 flex items-center gap-2 border-b border-gray-700 pb-2">
                                    <i class="fa-solid fa-list-ol text-emerald-400"></i> Phiếu tô đáp án
                                </h4>
                                <div class="flex-1 overflow-y-auto space-y-3 pr-2">
                                    ${Array.from({ length: qCount }).map((_, idx) => `
                                        <div class="flex items-center justify-between p-2 rounded-lg bg-gray-900 border border-gray-700/60">
                                            <span class="text-xs font-bold text-gray-300 w-12">Câu ${idx + 1}</span>
                                            <div class="flex gap-2">
                                                ${['A', 'B', 'C', 'D'].map(opt => `
                                                    <button onclick="selectPdfAnswer(${idx + 1}, '${opt}')" id="pdf_btn_${idx + 1}_${opt}" class="w-8 h-8 rounded-full border border-gray-600 bg-gray-800 text-xs font-bold text-gray-300 hover:border-brand-500 transition">
                                                        ${opt}
                                                    </button>
                                                `).join('')}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `}
                </div>
            `;

            // TIMER LOGIC
            clearInterval(examTimerInterval);
            examTimerInterval = setInterval(() => {
                const minutes = Math.floor(timeLeftSeconds / 60);
                const seconds = timeLeftSeconds % 60;
                const timerEl = document.getElementById('timerDisplay');
                if (timerEl) {
                    timerEl.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }

                if (timeLeftSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    alert("Đã hết thời gian làm bài! Hệ thống sẽ tự động nộp bài.");
                    submitExam();
                }
                timeLeftSeconds--;
            }, 1000);
        }

        function selectStudentAnswer(qIndex, answer) {
            studentAnswers[qIndex] = answer;
            ['A', 'B', 'C', 'D'].forEach(opt => {
                const btn = document.getElementById(`opt_btn_${qIndex}_${opt}`);
                if (btn) {
                    if (opt === answer) {
                        btn.classList.add('border-brand-500', 'bg-brand-500/10');
                        btn.classList.remove('bg-gray-900/60');
                    } else {
                        btn.classList.remove('border-brand-500', 'bg-brand-500/10');
                        btn.classList.add('bg-gray-900/60');
                    }
                }
            });

            // Update Nav Button
            const navBtn = document.getElementById(`nav_btn_${qIndex}`);
            if (navBtn) {
                navBtn.classList.add('bg-brand-600', 'text-white', 'border-brand-500');
                navBtn.classList.remove('bg-gray-900', 'text-gray-400');
            }
        }

        function selectPdfAnswer(qIndex, answer) {
            studentAnswers[qIndex] = answer;
            ['A', 'B', 'C', 'D'].forEach(opt => {
                const btn = document.getElementById(`pdf_btn_${qIndex}_${opt}`);
                if (btn) {
                    if (opt === answer) {
                        btn.classList.add('bg-brand-600', 'text-white', 'border-brand-500');
                        btn.classList.remove('bg-gray-800', 'text-gray-300');
                    } else {
                        btn.classList.remove('bg-brand-600', 'text-white', 'border-brand-500');
                        btn.classList.add('bg-gray-800', 'text-gray-300');
                    }
                }
            });
        }

        function scrollToQuestion(qIndex) {
            const el = document.getElementById(`q_card_${qIndex}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function submitExam() {
            if (!confirm("Bạn có chắc chắn muốn nộp bài thi này?")) return;
            clearInterval(examTimerInterval);

            const room = currentTakingExam;
            const isInteractive = room.type === 'interactive';
            const qCount = isInteractive ? (room.questions ? room.questions.length : 0) : (room.qCount || 0);

            let correctCount = 0;
            const keyMap = {};

            if (isInteractive) {
                room.questions.forEach((q, idx) => {
                    keyMap[idx + 1] = q.correct;
                    if (studentAnswers[idx + 1] === q.correct) {
                        correctCount++;
                    }
                });
            } else {
                for (let i = 1; i <= qCount; i++) {
                    const ansKey = room.answerKeys ? room.answerKeys[i] : null;
                    keyMap[i] = ansKey;
                    if (ansKey && studentAnswers[i] === ansKey) {
                        correctCount++;
                    }
                }
            }

            const score = Math.round((correctCount / qCount) * 10 * 10) / 10;
            const submission = {
                id: 'sub_' + Date.now(),
                roomId: room.id,
                roomTitle: room.title,
                subject: room.subject,
                score: score,
                correctCount: correctCount,
                totalCount: qCount,
                studentAnswers: { ...studentAnswers },
                roomSnapshot: JSON.parse(JSON.stringify(room)),
                timestamp: new Date().toLocaleString('vi-VN')
            };

            submissionsList.unshift(submission);
            saveDataToStorage();

            switchView('reviewSubmission', submission.id);
        }

        // --- VIEW 5: REVIEW SUBMISSION & DETAILED SOLUTIONS ---
        function renderReviewSubmissionView(container, submissionId) {

                        <div class="space-y-2 text-center md:text-left">

                            <h2 class="text-2xl font-extrabold text-white">${sub.roomTitle}</h2>
                            <p class="text-xs text-gray-400">Thời gian hoàn thành: ${sub.timestamp}</p>
                        </div>
                        
                        <div class="flex items-center gap-6">
                            <div class="text-center px-4 py-3 bg-gray-900/80 rounded-2xl border border-gray-700">
                                <p class="text-xs text-gray-400 uppercase font-semibold">Điểm số</p>
                                <p class="text-3xl font-black text-brand-400">${sub.score} <span class="text-sm text-gray-400 font-normal">/ 10</span></p>
                            </div>
                            <div class="text-center px-4 py-3 bg-gray-900/80 rounded-2xl border border-gray-700">
                                <p class="text-xs text-gray-400 uppercase font-semibold">Số câu đúng</p>
                                <p class="text-3xl font-black text-emerald-400">${sub.correctCount} <span class="text-sm text-gray-400 font-normal">/ ${sub.totalCount}</span></p>
                            </div>
                        </div>
                    </div>

                    ${isInteractive ? `
                        <div class="space-y-6">
                            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-square-check text-emerald-400"></i> Xem Lại Đáp Án & Hướng Dẫn Giải Chi Tiết
                            </h3>

                            ${questions.map((q, idx) => {
                                const userAns = sub.studentAnswers[idx + 1];
                                const isCorrect = userAns === q.correct;
                                const isSkipped = !userAns;

                                return `
                                    <div class="bg-gray-800 border ${isCorrect ? 'border-emerald-500/50' : isSkipped ? 'border-amber-500/50' : 'border-red-500/50'} rounded-2xl p-6 space-y-4 shadow-lg">
                                        <div class="flex justify-between items-center border-b border-gray-700/60 pb-3">
                                            <span class="font-bold text-white text-base">Câu ${idx + 1}</span>
                                            <span class="px-3 py-1 rounded-full text-xs font-bold ${isCorrect ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : isSkipped ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-red-500/20 text-red-400 border border-red-500/30'}">
                                                ${isCorrect ? '✓ ĐÚNG' : isSkipped ? '⚠ BỎ TRỐNG' : '✗ SAI'}
                                            </span>
                                        </div>

                                        <div class="text-gray-100 text-base leading-relaxed">
                                            ${q.content}
                                        </div>

                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
                                            ${['A', 'B', 'C', 'D'].map(opt => {
                                                const isUserSelected = userAns === opt;
                                                const isRightAnswer = q.correct === opt;

                                                let cardStyle = "border-gray-700 bg-gray-900/60 text-gray-300";
                                                if (isRightAnswer) {
                                                    cardStyle = "border-emerald-500 bg-emerald-500/10 text-emerald-300 font-semibold";
                                                } else if (isUserSelected && !isRightAnswer) {
                                                    cardStyle = "border-red-500 bg-red-500/10 text-red-300 font-semibold";
                                                }

                                                return `
                                                    <div class="p-3.5 rounded-xl border ${cardStyle} text-sm flex items-start gap-2">
                                                        <span class="font-bold">${opt}.</span>
                                                        <div class="flex-1">${q.options ? (q.options[opt] || '') : ''}</div>
                                                        ${isRightAnswer ? '<i class="fa-solid fa-check text-emerald-400"></i>' : ''}
                                                        ${isUserSelected && !isRightAnswer ? '<i class="fa-solid fa-xmark text-red-400"></i>' : ''}
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>

                                        <div class="bg-gray-900/90 rounded-xl p-4 border border-brand-500/30 space-y-2 mt-4">
                                            <h4 class="text-xs font-bold text-brand-400 uppercase tracking-wider flex items-center gap-1.5">
                                                <i class="fa-regular fa-lightbulb text-amber-400 text-sm"></i> Hướng Dẫn Giải Chi Tiết:
                                            </h4>
                                            <div class="text-sm text-gray-200 leading-relaxed overflow-x-auto">
                                                ${q.explanation || 'Chưa có hướng dẫn giải chi tiết cho câu hỏi này.'}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    ` : `
                        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 space-y-4 shadow-lg">
                            <h3 class="text-lg font-bold text-white mb-4">Đáp án chi tiết (File PDF)</h3>
                            <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3">
                                ${Array.from({ length: sub.totalCount }).map((_, idx) => {
                                    const userAns = sub.studentAnswers[idx + 1] || 'Chưa chọn';
                                    const keyAns = room.answerKeys ? room.answerKeys[idx + 1] : '---';
                                    const isCorrect = userAns === keyAns;

                                    return `
                                        <div class="p-3 bg-gray-900 rounded-xl border border-gray-700 text-center space-y-1">
                                            <p class="text-xs font-bold text-gray-400">Câu ${idx + 1}</p>

                                            <p class="text-xs text-emerald-400 font-medium">${sub.correctCount}/${sub.totalCount} câu đúng</p>

                        </div>
                    `}
                </div>
            `;

        // --- ADMIN MODAL & QUESTION BUILDER FORM LOGIC ---
        let builderQuestions = [];

        function openExamRoomModal() {
            document.getElementById('examRoomForm').reset();
            builderQuestions = [];
            addNewQuestionBuilderItem();
            toggleExamCreationType();
            generatePdfAnswerKeyInputs();
            document.getElementById('examRoomModal').classList.remove('hidden');
        }

        function closeExamRoomModal() {
            document.getElementById('examRoomModal').classList.add('hidden');
        }

        function toggleExamCreationType() {
            const type = document.querySelector('input[name="erType"]:checked').value;
            const pdfSec = document.getElementById('pdfTypeSection');
            const intSec = document.getElementById('interactiveTypeSection');

            if (type === 'interactive') {
                pdfSec.classList.add('hidden');
                intSec.classList.remove('hidden');
            } else {
                pdfSec.classList.remove('hidden');
                intSec.classList.add('hidden');
            }
        }

        function generatePdfAnswerKeyInputs() {
            const count = parseInt(document.getElementById('erQCount').value) || 20;
            const container = document.getElementById('pdfAnswerKeyContainer');
            let html = '';
            for (let i = 1; i <= count; i++) {
                html += `
                    <div class="flex flex-col text-center">
                        <span class="text-[10px] text-gray-400 font-bold mb-0.5">C${i}</span>
                        <select id="pdf_key_${i}" class="bg-gray-800 border border-gray-700 rounded text-xs py-1 px-1 text-center font-bold text-brand-300">
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function addNewQuestionBuilderItem() {
            const qIdx = builderQuestions.length + 1;
            builderQuestions.push({
                id: qIdx,
                content: '',
                options: { A: '', B: '', C: '', D: '' },
                correct: 'A',
                explanation: ''
            });
            renderQuestionBuilderList();
        }

        function removeQuestionBuilderItem(index) {
            builderQuestions.splice(index, 1);
            renderQuestionBuilderList();
        }

        function insertTagToInput(inputId, tagType) {
            const el = document.getElementById(inputId);
            if (!el) return;
            let snippet = '';
            if (tagType === 'image') snippet = '<img src="https://link-anh.com/image.jpg" class="rounded max-w-full my-2">';
            if (tagType === 'video') snippet = '<video controls src="https://link-video.mp4" class="w-full rounded my-2"></video>';
            if (tagType === 'audio') snippet = '<audio controls src="https://link-am-thanh.mp3" class="my-2"></audio>';
            if (tagType === 'latex') snippet = '$\\frac{a}{b}$';

            const start = el.selectionStart || 0;
            const end = el.selectionEnd || 0;
            const text = el.value;
            el.value = text.substring(0, start) + snippet + text.substring(end);
            el.focus();
        }

        function renderQuestionBuilderList() {
            const container = document.getElementById('interactiveQuestionsContainer');
            container.innerHTML = builderQuestions.map((q, idx) => `
                <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 space-y-4">
                    <div class="flex justify-between items-center bg-gray-900 px-3 py-2 rounded-lg">
                        <span class="text-sm font-bold text-brand-400">Câu hỏi số ${idx + 1}</span>
                        ${builderQuestions.length > 1 ? `
                        <button type="button" onclick="removeQuestionBuilderItem(${idx})" class="text-red-400 hover:text-red-300 text-xs">
                            <i class="fa-solid fa-trash"></i> Xóa câu này
                        </button>` : ''}
                    </div>

                    <div class="flex flex-wrap gap-2 text-xs">
                        <span class="text-gray-400 py-1 font-semibold">Chèn nhanh:</span>
                        <button type="button" onclick="insertTagToInput('q_content_${idx}', 'latex')" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-brand-300 font-mono">$LaTeX$</button>
                        <button type="button" onclick="insertTagToInput('q_content_${idx}', 'image')" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-emerald-300"><i class="fa-regular fa-image"></i> Ảnh</button>
                        <button type="button" onclick="insertTagToInput('q_content_${idx}', 'video')" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-purple-300"><i class="fa-solid fa-video"></i> Video</button>
                        <button type="button" onclick="insertTagToInput('q_content_${idx}', 'audio')" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-amber-300"><i class="fa-solid fa-music"></i> Âm thanh</button>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Nội dung câu hỏi (Hỗ trợ HTML, LaTeX $...$)</label>
                        <textarea id="q_content_${idx}" rows="3" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm font-mono focus:border-brand-500 focus:outline-none" placeholder="Nhập nội dung câu hỏi... (VD: Cho phương trình $x^2 - 4 = 0$)">${q.content || ''}</textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${['A', 'B', 'C', 'D'].map(opt => `
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Đáp án ${opt}</label>
                                <input type="text" id="q_opt_${idx}_${opt}" value="${q.options ? (q.options[opt] || '') : ''}" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm focus:border-brand-500 focus:outline-none">
                            </div>
                        `).join('')}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-emerald-400 mb-1">Đáp án đúng chuẩn *</label>
                            <select id="q_correct_${idx}" class="w-full bg-gray-900 border border-emerald-500/50 rounded-lg px-3 py-2 text-sm font-bold text-emerald-300 focus:outline-none">
                                <option value="A" ${q.correct === 'A' ? 'selected' : ''}>Đáp án A</option>
                                <option value="B" ${q.correct === 'B' ? 'selected' : ''}>Đáp án B</option>
                                <option value="C" ${q.correct === 'C' ? 'selected' : ''}>Đáp án C</option>
                                <option value="D" ${q.correct === 'D' ? 'selected' : ''}>Đáp án D</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-xs font-semibold text-brand-400">Hướng dẫn giải chi tiết (LaTeX, Media)</label>
                                <div class="space-x-1 text-[11px]">
                                    <button type="button" onclick="insertTagToInput('q_exp_${idx}', 'latex')" class="text-brand-300 underline">$LaTeX$</button>
                                    <button type="button" onclick="insertTagToInput('q_exp_${idx}', 'image')" class="text-emerald-300 underline">Ảnh</button>
                                </div>
                            </div>
                            <textarea id="q_exp_${idx}" rows="2" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm font-mono focus:border-brand-500 focus:outline-none" placeholder="Nhập lời giải chi tiết giúp học sinh xem lại...">${q.explanation || ''}</textarea>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function saveExamRoomData(e) {
            e.preventDefault();
            const title = document.getElementById('erTitle').value;
            const subject = document.getElementById('erSubject').value;
            const duration = parseInt(document.getElementById('erDuration').value) || 45;
            const type = document.querySelector('input[name="erType"]:checked').value;

            const roomObj = {
                id: 'exam_' + Date.now(),
                title, subject, duration, type
            };

            if (type === 'pdf') {
                roomObj.link = document.getElementById('erPdfLink').value;
                const qCount = parseInt(document.getElementById('erQCount').value) || 20;
                roomObj.qCount = qCount;
                roomObj.answerKeys = {};
                for (let i = 1; i <= qCount; i++) {
                    const el = document.getElementById(`pdf_key_${i}`);
                    if (el) roomObj.answerKeys[i] = el.value;
                }
            } else {
                // Interactive type
                const compiledQuestions = [];
                for (let i = 0; i < builderQuestions.length; i++) {
                    const content = document.getElementById(`q_content_${i}`).value;
                    const optA = document.getElementById(`q_opt_${i}_A`).value;
                    const optB = document.getElementById(`q_opt_${i}_B`).value;
                    const optC = document.getElementById(`q_opt_${i}_C`).value;
                    const optD = document.getElementById(`q_opt_${i}_D`).value;
                    const correct = document.getElementById(`q_correct_${i}`).value;
                    const explanation = document.getElementById(`q_exp_${i}`).value;

                    compiledQuestions.push({
                        id: i + 1,
                        content,
                        options: { A: optA, B: optB, C: optC, D: optD },
                        correct,
                        explanation
                    });
                }
                roomObj.questions = compiledQuestions;
            }

            examRoomsList.unshift(roomObj);
            saveDataToStorage();
            closeExamRoomModal();
            renderCurrentView();
        }

        function deleteExamRoom(roomId) {
            if (confirm("Bạn có chắc chắn muốn xóa phòng thi này?")) {
                examRoomsList = examRoomsList.filter(r => r.id !== roomId);
                saveDataToStorage();
                renderCurrentView();
            }
        }
    </script>
</body>
</html>
