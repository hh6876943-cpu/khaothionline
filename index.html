<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Edu - Nền tảng Khảo thí & Ôn luyện Thông minh</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- THÊM FIREBASE CDN (Dùng bản Compat để không phá vỡ cấu trúc biến toàn cục của bạn) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap');
        body { font-family: 'Quicksand', 'Be Vietnam Pro', sans-serif; letter-spacing: -0.01em; font-size: 1.1rem; }
        .glass-panel { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(25px); border: 1px solid rgba(51, 65, 85, 0.6); }
        .light .glass-panel { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(226, 232, 240, 0.8); }
        .card-hover { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-6px) scale(1.01); box-shadow: 0 25px 35px -10px rgba(59, 130, 246, 0.2); }
        .gradient-text { background: linear-gradient(135deg, #60a5fa 0%, #818cf8 50%, #38bdf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @media print {
            body * { visibility: hidden; }
            #certificatePrintArea, #certificatePrintArea * { visibility: visible; }
            #certificatePrintArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col transition-colors duration-300 text-base">
    
    <!-- ==================== MODAL THÔNG BÁO ==================== -->
    <div id="customAlertModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-md hidden p-4">
        <div class="glass-panel w-full max-w-sm p-6 rounded-3xl shadow-2xl relative border border-slate-700 bg-slate-900 text-center space-y-4 transform transition-all scale-100 animate-bounce-short">
            <div id="customAlertIcon" class="w-16 h-16 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-3xl mx-auto shadow-xl shadow-blue-600/40">
                <i class="fa-solid fa-bell"></i>
            </div>
            <div>
                <h3 id="customAlertTitle" class="text-xl font-bold text-white">Thông báo hệ thống</h3>
                <p id="customAlertMessage" class="text-sm text-slate-300 mt-2">Nội dung thông báo...</p>
            </div>
            <button onclick="closeCustomAlert()" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold transition text-base shadow-lg shadow-blue-600/30">
                Đã hiểu
            </button>
        </div>
    </div>

    <!-- ==================== MÀN HÌNH ĐĂNG NHẬP / HOME ==================== -->
    <div id="homeScreen" class="min-h-screen flex flex-col justify-between relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-indigo-950 to-blue-950 z-0">
            <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#38bdf8_1px,transparent_1px)] [background-size:32px_32px]"></div>
        </div>
        <header class="relative z-10 max-w-7xl mx-auto w-full px-6 py-6 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-xl shadow-blue-500/30 text-2xl">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <span class="text-3xl font-extrabold tracking-wider text-white">Zenith<span class="text-blue-400"> Edu</span></span>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="toggleDarkMode()" class="w-12 h-12 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center backdrop-blur-md transition text-lg">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-yellow-400"></i>
                </button>
                <button onclick="openLoginModal()" class="px-7 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold shadow-lg shadow-blue-600/40 transition flex items-center space-x-2 text-base">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Đăng nhập hệ thống</span>
                </button>
            </div>
        </header>
        <main class="relative z-10 max-w-7xl mx-auto px-6 py-16 text-center my-auto flex flex-col items-center">
            <h1 class="text-5xl md:text-7xl font-extrabold text-white tracking-tight max-w-4xl mb-6 leading-tight">
                Hệ thống Ngân hàng Đề thi & <span class="bg-gradient-to-r from-blue-400 via-indigo-300 to-cyan-400 bg-clip-text text-transparent">Ôn luyện chuyên sâu</span>
            </h1>
            <p class="text-lg md:text-xl text-slate-300 max-w-2xl mb-10 leading-relaxed">
                Kho tài nguyên đề thi Google Drive đồng bộ trực tuyến.
            </p>
            <button onclick="openLoginModal()" class="px-9 py-4.5 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold shadow-xl shadow-blue-600/50 hover:scale-105 transition flex items-center space-x-3 text-lg">
                <span>Vào hệ thống ngay</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </main>
    </div>

    <!-- Modal Đăng nhập -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md hidden p-4">
        <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl relative border border-slate-700 bg-slate-900">
            <button onclick="closeLoginModal()" class="absolute top-6 right-6 text-slate-400 hover:text-white text-2xl"><i class="fa-solid fa-xmark"></i></button>
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-white">Đăng nhập tài khoản</h2>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <input type="text" id="usernameInput" placeholder="Nhập tài khoản (VD: admin)" required class="w-full px-4 py-3.5 rounded-xl bg-slate-950 border border-slate-800 focus:outline-none focus:border-blue-500 text-white">
                </div>
                <div>
                    <input type="password" id="passwordInput" placeholder="Mật khẩu (VD: 123456)" required class="w-full px-4 py-3.5 rounded-xl bg-slate-950 border border-slate-800 focus:outline-none focus:border-blue-500 text-white">
                </div>
                <div id="loginError" class="text-red-500 text-sm text-center hidden font-semibold">Sai tài khoản hoặc mật khẩu!</div>
                <button type="submit" class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold transition text-base">Vào hệ thống</button>
            </form>
        </div>
    </div>

    <!-- ==================== GIAO DIỆN CHÍNH SAU KHI ĐĂNG NHẬP ==================== -->
    <div id="dashboardScreen" class="min-h-screen flex bg-slate-950 text-slate-100 select-none w-full hidden">
        <aside class="w-80 bg-[#1d4ed8] flex flex-col border-r border-blue-700/50 shrink-0 text-white">
            <div class="h-24 px-6 flex items-center space-x-4 border-b border-blue-700/40">
                <span class="text-2xl font-bold tracking-wider">Zenith Edu</span>
            </div>
            <nav id="sidebarMenuNav" class="p-5 space-y-2 text-sm font-semibold flex-1 overflow-y-auto"></nav>
        </aside>
        
        <div class="flex-1 flex flex-col bg-slate-950 overflow-y-auto min-h-screen">
            <header class="h-24 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-8 flex items-center justify-between sticky top-0 z-30 shadow-sm">
                <div id="headerTitleArea">
                    <h2 class="text-lg font-bold text-white">Tổng quan trang chủ</h2>
                </div>
                <div class="flex items-center space-x-5">
                    <button onclick="handleLogout()" class="px-4 py-2 rounded-xl bg-red-950/40 border border-red-900 text-red-400">Đăng xuất</button>
                </div>
            </header>
            
            <main id="mainViewContent" class="flex-1 p-8 max-w-7xl w-full mx-auto"></main>
        </div>
    </div>

    <!-- Modal Thêm/Sửa Môn Học -->
    <div id="subjectModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md hidden p-4">
        <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl relative border border-slate-700 bg-slate-900">
            <button onclick="closeSubjectModal()" class="absolute top-6 right-6 text-slate-400 hover:text-white text-2xl"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-2xl font-bold text-white mb-6">Thêm môn học mới</h3>
            
            <!-- FORM NÀY ĐÃ ĐƯỢC TÍCH HỢP FIREBASE (Xem logic JS bên dưới) -->
            <form onsubmit="saveSubjectData(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-400 mb-1">Mã môn học (không dấu, viết liền)</label>
                    <input type="text" id="subjectKeyInput" placeholder="VD: sinhhoc" required class="w-full px-4 py-3.5 rounded-2xl bg-slate-950 border border-slate-800 text-white">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-400 mb-1">Tên hiển thị môn học</label>
                    <input type="text" id="subjectNameInput" placeholder="VD: Sinh học nâng cao" required class="w-full px-4 py-3.5 rounded-2xl bg-slate-950 border border-slate-800 text-white">
                </div>
                <button type="submit" class="w-full py-4 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-bold transition mt-4">
                    Lưu môn học (Lên Firebase)
                </button>
            </form>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT LOGIC ==================== -->
    <script>
        // ==========================================
        // 1. KHỞI TẠO FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBOTCmsL77Ae9zt7qW2XBPmbSykM0Pmqrc",
            authDomain: "khao-thi-online-a7f4e.firebaseapp.com",
            databaseURL: "https://khao-thi-online-a7f4e-default-rtdb.firebaseio.com",
            projectId: "khao-thi-online-a7f4e",
            storageBucket: "khao-thi-online-a7f4e.firebasestorage.app",
            messagingSenderId: "445490126605",
            appId: "1:445490126605:web:23b28c3ae24d5c95655a44",
            measurementId: "G-NXHSKDWQPL"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const analytics = firebase.analytics();

        // ==========================================
        // 2. LOGIC ỨNG DỤNG (Mock Data)
        // ==========================================
        let currentUser = null;
        let userRoleKey = 'student';

        let userProfiles = {
            'admin': { name: 'Quản trị viên', username: 'admin', password: '123456', role: 'admin' },
            'student': { name: 'Học sinh', username: 'hocsinh', password: '123456', role: 'student' }
        };

        // Các hàm giao diện cơ bản
        function showCustomAlert(title, message) {
            document.getElementById('customAlertTitle').innerText = title;
            document.getElementById('customAlertMessage').innerText = message;
            document.getElementById('customAlertModal').classList.remove('hidden');
        }
        function closeCustomAlert() { document.getElementById('customAlertModal').classList.add('hidden'); }
        
        function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }
        function closeSubjectModal() { document.getElementById('subjectModal').classList.add('hidden'); }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value;
            
            if(userProfiles[user] && userProfiles[user].password === pass) {
                currentUser = userProfiles[user];
                userRoleKey = currentUser.role;
                closeLoginModal();
                document.getElementById('homeScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
                initDashboard();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }
        
        function handleLogout() {
            currentUser = null;
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
        }

        function initDashboard() {
            renderSidebarMenu();
            switchTab('trangchu');
        }

        function renderSidebarMenu() {
            let nav = document.getElementById('sidebarMenuNav');
            let isAdmin = currentUser && userRoleKey === 'admin';
            let menuHTML = `
                <a href="#" onclick="switchTab('trangchu')" id="menu-trangchu" class="flex items-center px-5 py-3.5 rounded-2xl hover:bg-blue-700/60 transition"><i class="fa-solid fa-house w-6"></i> Trang chủ</a>
            `;
            if (isAdmin) {
                menuHTML += `
                <a href="#" onclick="document.getElementById('subjectModal').classList.remove('hidden')" class="flex items-center px-5 py-3.5 rounded-2xl hover:bg-blue-700/60 text-yellow-300 transition mt-4">
                    <i class="fa-solid fa-plus w-6"></i> Thêm môn học mới
                </a>`;
            }
            nav.innerHTML = menuHTML;
        }

        function switchTab(tabId) {
            let mainContainer = document.getElementById('mainViewContent');
            if (tabId === 'trangchu') {
                mainContainer.innerHTML = `
                    <div class="glass-panel p-8 rounded-3xl border border-slate-800 bg-slate-900 shadow-xl">
                        <h3 class="text-3xl font-extrabold text-white mb-2">Xin chào, ${currentUser ? currentUser.name : ''}!</h3>
                        <p class="text-slate-300">Chào mừng bạn đến với hệ thống. Chúc bạn một ngày học tập hiệu quả!</p>
                        ${currentUser.role === 'admin' ? '<p class="text-yellow-400 mt-4 font-bold">Hãy thử click vào nút "Thêm môn học mới" bên trái để test chức năng lưu Firebase nhé!</p>' : ''}
                    </div>
                `;
            }
        }

        // ==========================================
        // 3. VÍ DỤ: LƯU DỮ LIỆU LÊN FIREBASE REALTIME DB
        // ==========================================
        function saveSubjectData(event) {
            event.preventDefault(); // Ngăn form reload lại trang

            // Lấy dữ liệu từ input
            const subjectKey = document.getElementById('subjectKeyInput').value.trim().toLowerCase();
            const subjectName = document.getElementById('subjectNameInput').value.trim();

            if (!subjectKey || !subjectName) {
                showCustomAlert("Lỗi", "Vui lòng nhập đầy đủ thông tin.");
                return;
            }

            // Reference tới node 'subjects' trong Database
            const subjectRef = database.ref('subjects/' + subjectKey);

            // Ghi dữ liệu lên Firebase
            subjectRef.set({
                name: subjectName,
                createdBy: currentUser.username,
                createdAt: new Date().toISOString()
            })
            .then(() => {
                showCustomAlert("Thành công", `Đã lưu môn học "${subjectName}" lên Firebase thành công!`);
                
                // Xóa form và đóng modal
                document.getElementById('subjectKeyInput').value = '';
                document.getElementById('subjectNameInput').value = '';
                closeSubjectModal();
            })
            .catch((error) => {
                showCustomAlert("Lỗi Firebase", "Không thể lưu dữ liệu: " + error.message);
                console.error(error);
            });
        }
    </script>
</body>
</html>
